# 应用服务 WEB 访问端口
server:
  port: 8080
  address: 0.0.0.0  # 允许局域网访问

spring:
  profiles:
    active: mysql  # 默认使用MySQL环境
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  # MySQL数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/personal_ledger?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: root
    password: Root@123456
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

# MyBatis-Plus配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.gaoyan.personalledger.entity
  global-config:
    banner: false
    db-config:
      id-type: auto
      field-strategy: ignored
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    use-generated-keys: true
    default-executor-type: simple